{% extends "base.html" %}

{% block title %}
Ollama-Regelwerk
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">
            Ollama-Regelwerk
        </h1>

        <p class="page-subtitle">
            Regeln, nach denen Ollama deine Berichtsheft-Einträge generiert.
        </p>
    </div>
</div>

<div class="day-card">

    <div class="card-header">
        <div class="day-info">
            <span class="day-name">
                Regelwerk
            </span>
        </div>

        <span class="status-badge" id="rules-status"></span>
    </div>

    <div class="field-group">
        <textarea
            class="day-textarea"
            id="rules-textarea"
            style="min-height: 400px; font-family: monospace;"
        >{{ regelwerk }}</textarea>
    </div>

    <div class="card-footer">
        <button
            class="pushable"
            onclick="saveRules(this)"
        >
            <span class="front">Regelwerk speichern</span>
        </button>
    </div>

</div>

{% endblock %}
