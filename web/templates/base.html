<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Berichtsheft-Generator
        {% endblock %}
    </title>

    <!-- Setzt die Dark-Mode-Klasse VOR dem ersten Rendern der Seite,
         sonst blitzt kurz der helle Modus auf, bevor app.js überhaupt
         geladen ist (klassisches "Flash of wrong theme"-Problem) -->
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark-mode");
            }
        })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="navbar-brand">
            Berichtsheft-Generator
        </div>

        <nav class="navbar-links">
            <a
                href="{{ url_for('index') }}"
                class="navbar-link{{ ' active' if request.path == url_for('index') else '' }}"
            >
                Übersicht
            </a>
            <a
                href="{{ url_for('bericht') }}"
                class="navbar-link{{ ' active' if request.path == url_for('bericht') else '' }}"
            >
                Bericht
            </a>
            <a
                href="{{ url_for('ollama_regelwerk') }}"
                class="navbar-link{{ ' active' if request.path == url_for('ollama_regelwerk') else '' }}"
            >
                Ollama-Regelwerk
            </a>
        </nav>

        <div class="navbar-week">
            KW {{ current_week }} / {{ current_year }}
        </div>

        <button
            class="theme-toggle"
            onclick="toggleDarkMode()"
            aria-label="Dark Mode umschalten"
        >
            <span class="theme-toggle-icon">🌙</span>
        </button>

    </header>

    <!-- Seiteninhalt -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>

</html>
